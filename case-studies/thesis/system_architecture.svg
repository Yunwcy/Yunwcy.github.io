<svg viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="13" width="780" height="620">
  <title>NTPU OPE Assistant 系統架構圖</title>

  <!-- Background -->
  <rect width="780" height="620" fill="#f8f8f8" rx="12"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#111">NTPU OPE Assistant — 系統架構圖</text>
  <text x="390" y="54" text-anchor="middle" font-size="11" fill="#888">現行部署（2026-06-24）</text>

  <!-- ===== LAYER 4: 展示層 ===== -->
  <rect x="30" y="72" width="720" height="118" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="46" y="92" font-size="11" font-weight="700" fill="#4338ca">第 4 層　展示層（Frontend）</text>

  <rect x="50" y="102" width="110" height="72" rx="6" fill="white" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="105" y="130" text-anchor="middle" font-size="20">👤</text>
  <text x="105" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#111">使用者</text>
  <text x="105" y="166" text-anchor="middle" font-size="10" fill="#888">瀏覽器</text>

  <rect x="210" y="102" width="190" height="72" rx="6" fill="white" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="305" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Gradio UI</text>
  <text x="305" y="138" text-anchor="middle" font-size="10" fill="#888">文字 / 語音 / 圖片 輸入</text>
  <text x="305" y="152" text-anchor="middle" font-size="10" fill="#888">串流回應 · 對話歷史</text>
  <text x="305" y="166" text-anchor="middle" font-size="10" fill="#6366f1">port 7860</text>

  <rect x="450" y="102" width="270" height="72" rx="6" fill="white" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="585" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Cloudflare Tunnel（Zero Trust）</text>
  <text x="585" y="136" text-anchor="middle" font-size="10" fill="#888">ATECxNTPU tunnel</text>
  <text x="585" y="150" text-anchor="middle" font-size="10" fill="#888">ntpuopeagent.aifitesg.org → 127.0.0.1:7860</text>
  <text x="585" y="164" text-anchor="middle" font-size="10" fill="#888">HTTPS · SSL 終止</text>

  <line x1="160" y1="138" x2="208" y2="138" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="138" x2="448" y2="138" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== LAYER 3: 應用層 ===== -->
  <rect x="30" y="212" width="720" height="148" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="46" y="232" font-size="11" font-weight="700" fill="#15803d">第 3 層　應用層（Backend · Python）</text>

  <rect x="50" y="242" width="160" height="102" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="130" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Agentic Loop</text>
  <text x="130" y="278" text-anchor="middle" font-size="10" fill="#888">OpenAI Responses API</text>
  <text x="130" y="292" text-anchor="middle" font-size="10" fill="#888">gpt-5.4-mini（主）</text>
  <text x="130" y="306" text-anchor="middle" font-size="10" fill="#888">gpt-4o-mini（輔助）</text>
  <text x="130" y="320" text-anchor="middle" font-size="10" fill="#888">Tool calling · 多輪推理</text>
  <text x="130" y="336" text-anchor="middle" font-size="10" fill="#16a34a">Rate limit 15 req/min/IP</text>

  <rect x="230" y="242" width="160" height="102" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="310" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Hybrid Retrieval</text>
  <text x="310" y="278" text-anchor="middle" font-size="10" fill="#888">FAISS 向量搜尋</text>
  <text x="310" y="292" text-anchor="middle" font-size="10" fill="#888">BM25 全文搜尋</text>
  <text x="310" y="306" text-anchor="middle" font-size="10" fill="#888">Reranking</text>
  <text x="310" y="320" text-anchor="middle" font-size="10" fill="#888">HyDE 查詢擴展</text>
  <text x="310" y="334" text-anchor="middle" font-size="10" fill="#888">text-embedding-3-small</text>

  <rect x="410" y="242" width="150" height="102" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="485" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#111">多模態處理</text>
  <text x="485" y="278" text-anchor="middle" font-size="10" fill="#888">STT：Whisper-1</text>
  <text x="485" y="292" text-anchor="middle" font-size="10" fill="#888">TTS：tts-1</text>
  <text x="485" y="306" text-anchor="middle" font-size="10" fill="#888">Vision：gpt-4o</text>
  <text x="485" y="320" text-anchor="middle" font-size="10" fill="#888">Prompt Injection 偵測</text>

  <rect x="578" y="242" width="150" height="102" rx="6" fill="white" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="653" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#111">安全機制</text>
  <text x="653" y="278" text-anchor="middle" font-size="10" fill="#888">OPE 相關性過濾</text>
  <text x="653" y="292" text-anchor="middle" font-size="10" fill="#888">corrections.md 修正</text>
  <text x="653" y="306" text-anchor="middle" font-size="10" fill="#888">chat_logs.csv 紀錄</text>
  <text x="653" y="320" text-anchor="middle" font-size="10" fill="#888">allowed_paths=[]</text>

  <!-- ===== LAYER 2: 資料層 ===== -->
  <rect x="30" y="382" width="720" height="118" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="46" y="402" font-size="11" font-weight="700" fill="#c2410c">第 2 層　資料層（Knowledge Base）</text>

  <rect x="50" y="412" width="155" height="72" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="127" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#111">網站知識庫</text>
  <text x="127" y="450" text-anchor="middle" font-size="10" fill="#888">all_content_v2.md</text>
  <text x="127" y="466" text-anchor="middle" font-size="10" fill="#888">每 3 天自動爬蟲更新</text>

  <rect x="222" y="412" width="155" height="72" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="299" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#111">法規 / 表單庫</text>
  <text x="299" y="450" text-anchor="middle" font-size="10" fill="#888">ALL_files_2.md</text>
  <text x="299" y="466" text-anchor="middle" font-size="10" fill="#888">手動執行 PDF 解析</text>

  <rect x="394" y="412" width="155" height="72" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="471" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#111">向量索引</text>
  <text x="471" y="450" text-anchor="middle" font-size="10" fill="#888">FAISS index</text>
  <text x="471" y="466" text-anchor="middle" font-size="10" fill="#888">啟動時自動建立</text>

  <rect x="566" y="412" width="155" height="72" rx="6" fill="white" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="643" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#111">修正 / 紀錄</text>
  <text x="643" y="450" text-anchor="middle" font-size="10" fill="#888">corrections.md</text>
  <text x="643" y="466" text-anchor="middle" font-size="10" fill="#888">chat_logs.csv（6 月）</text>

  <!-- ===== LAYER 1: 基礎架構 ===== -->
  <rect x="30" y="522" width="720" height="80" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="46" y="542" font-size="11" font-weight="700" fill="#7e22ce">第 1 層　基礎架構（Infrastructure）</text>

  <rect x="50" y="552" width="180" height="36" rx="5" fill="white" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="140" y="568" text-anchor="middle" font-size="10" font-weight="600" fill="#111">學校電腦</text>
  <text x="140" y="581" text-anchor="middle" font-size="10" fill="#888">Windows · RTX 4090 · Python</text>

  <rect x="250" y="552" width="180" height="36" rx="5" fill="white" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="340" y="568" text-anchor="middle" font-size="10" font-weight="600" fill="#111">Cloudflare Zero Trust</text>
  <text x="340" y="581" text-anchor="middle" font-size="10" fill="#888">Tunnel · SSL · DDoS 防護</text>

  <rect x="450" y="552" width="180" height="36" rx="5" fill="white" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="540" y="568" text-anchor="middle" font-size="10" font-weight="600" fill="#111">OpenAI API</text>
  <text x="540" y="581" text-anchor="middle" font-size="10" fill="#888">gpt-5.4-mini · gpt-4o · Whisper</text>

  <!-- Layer separating arrows -->
  <line x1="390" y1="190" x2="390" y2="210" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <line x1="390" y1="360" x2="390" y2="380" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <line x1="390" y1="500" x2="390" y2="520" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr2)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#818cf8"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
  </defs>
</svg>
