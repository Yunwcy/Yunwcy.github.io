<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img">
<title>Knovyra 技術堆疊圖</title>
<desc>四層架構：展示層（Next.js 16、Agent Console、Dashboard）、應用層（API Routes、角色治理、Rate Limiting）、AI 智能層（Agent Planner、6 個 Function Calling Tools）、基礎架構層（Vercel、Postgres、Vercel Blob、OpenAI/Anthropic）。</desc>
