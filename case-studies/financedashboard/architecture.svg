<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img">
<title>個人財務理財儀表板 App 系統運作架構圖</title>
<desc>使用者操作經由 SwiftUI 介面送出，統一由 FinanceStore 更新財務功能模組與核心資料，並同步驅動圖表、快照、加密儲存與備份，同時整合 Yahoo Finance／Stooq 外部股價服務。</desc>
<rect width="1800" height="1200" rx="20" fill="#f6f8fc"/>
<text x="72" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#1f2a44">個人財務理財儀表板 App｜系統運作架構圖</text>
<text x="72" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#647084">使用者透過 SwiftUI 介面操作，各功能模組統一經由 FinanceStore 更新 FinanceVault，並同步驅動圖表、快照、備份與本機加密儲存。</text>
