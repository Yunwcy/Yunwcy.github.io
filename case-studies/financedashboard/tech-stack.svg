  <text x="1337" y="777" class="text">理財順序</text>
  <text x="1337" y="802" class="text">預算提醒</text>
  <text x="1337" y="827" class="text">資料檢查</text>

  <rect x="85" y="870" width="1410" height="35" rx="12" fill="#d9fbe9" stroke="#98efd0"/>
