  <text x="85" y="1037" class="layer-title" fill="#d67a00">第 2 層　財務模組與分析層（Financial Domain Modules）</text>

  <rect x="85" y="1065" width="210" height="145" rx="16" class="card" stroke="#ffe08a"/>
  <text x="125" y="1104" class="card-title">記帳</text>
  <text x="112" y="1137" class="text">收入 / 支出</text>
  <text x="112" y="1162" class="text">類別 / 帳戶</text>
  <text x="112" y="1187" class="text">預算進度</text>

  <rect x="320" y="1065" width="210" height="145" rx="16" class="card" stroke="#ffe08a"/>
  <text x="360" y="1104" class="card-title">投資</text>
  <text x="347" y="1137" class="text">台股 / 美股</text>
  <text x="347" y="1162" class="text">損益 / 報酬率</text>
  <text x="347" y="1187" class="text">配置 / 趨勢</text>

