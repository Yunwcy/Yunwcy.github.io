  <text x="582" y="1137" class="text">銀行 / 券商帳戶</text>
  <text x="582" y="1162" class="text">房貸 / 車貸</text>
  <text x="582" y="1187" class="text">還款壓力</text>

  <rect x="790" y="1065" width="210" height="145" rx="16" class="card" stroke="#ffe08a"/>
  <text x="830" y="1104" class="card-title">保險</text>
  <text x="817" y="1137" class="text">現金價值</text>
  <text x="817" y="1162" class="text">年化保費</text>
  <text x="817" y="1187" class="text">保障 / 投資拆分</text>

  <rect x="1025" y="1065" width="210" height="145" rx="16" class="card" stroke="#ffe08a"/>
  <text x="1065" y="1104" class="card-title">房地產</text>
  <text x="1052" y="1137" class="text">購入價 / 估值</text>
  <text x="1052" y="1162" class="text">租金 / 稅費</text>
  <text x="1052" y="1187" class="text">房貸後淨值</text>

  <rect x="1260" y="1065" width="235" height="145" rx="16" class="card" stroke="#ffe08a"/>
  <text x="1300" y="1104" class="card-title">理財規劃</text>
  <text x="1287" y="1137" class="text">緊急預備金</text>
  <text x="1287" y="1162" class="text">旅遊 / 退休目標</text>
  <text x="1287" y="1187" class="text">建議順序</text>

  <path d="M800 1270 L800 1325" class="arrow"/>

  <!-- Layer 1 -->
  <rect x="45" y="1320" width="1510" height="80" rx="28" fill="#f4edff" stroke="#b69cff" stroke-width="4"/>
  <text x="85" y="1370" class="layer-title" fill="#7c4dff">第 1 層　資料與安全層：FinanceVault・File Protection・AES-GCM・Keychain・LocalAuthentication・iPhone Local Storage</text>
</svg>
