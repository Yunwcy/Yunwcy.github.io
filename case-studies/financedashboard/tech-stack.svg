  <text x="998" y="458" class="card-title">資料提醒</text>
  <text x="982" y="490" class="text">資料健康檢查</text>
  <text x="982" y="514" class="text">快照 / 繳費提醒</text>

  <rect x="1245" y="420" width="250" height="105" rx="16" class="card" stroke="#a5f3fc"/>
  <text x="1288" y="458" class="card-title">安全狀態</text>
