<svg width="1600" height="1420" viewBox="0 0 1600 1420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f4f6fb; }
      .layer-title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #151927; }
      .text { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596275; }
      .small { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .chip { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .arrow { stroke: #b7bfcc; stroke-width: 6; fill: none; marker-end: url(#arrowhead); }
      .thin-arrow { stroke: #c4cad6; stroke-width: 3.5; fill: none; marker-end: url(#arrowhead-small); }
    </style>

    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b7bfcc"/>
    </marker>

    <marker id="arrowhead-small" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#c4cad6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1420" rx="18" class="bg"/>

  <!-- Layer 5: Presentation -->
  <rect x="45" y="35" width="1510" height="250" rx="28" fill="#eef2ff" stroke="#9aa8ff" stroke-width="4"/>
  <text x="85" y="88" class="layer-title" fill="#6370f5">第 5 層　展示層（SwiftUI Presentation）</text>

  <rect x="85" y="112" width="210" height="120" rx="16" class="card" stroke="#c4ccff"/>
  <text x="126" y="151" class="card-title">總覽</text>
  <text x="112" y="184" class="text">KPI 卡片</text>
  <text x="112" y="209" class="text">資產 / 負債圖</text>

  <rect x="320" y="112" width="210" height="120" rx="16" class="card" stroke="#c4ccff"/>
  <text x="360" y="151" class="card-title">日常記帳</text>
  <text x="348" y="184" class="text">收入 / 支出</text>
  <text x="348" y="209" class="text">類別 / 篩選</text>

  <rect x="555" y="112" width="210" height="120" rx="16" class="card" stroke="#c4ccff"/>
  <text x="595" y="151" class="card-title">股票投資</text>
  <text x="583" y="184" class="text">台股 / 美股</text>
  <text x="583" y="209" class="text">收益 / CSV</text>

