  <rect x="45" y="625" width="1510" height="305" rx="28" fill="#eafff5" stroke="#70e5b5" stroke-width="4"/>
  <text x="85" y="677" class="layer-title" fill="#079668">第 3 層　應用邏輯層（Application Logic）</text>

  <rect x="85" y="705" width="220" height="145" rx="16" class="card" stroke="#98efd0"/>
  <text x="123" y="744" class="card-title">FinanceStore</text>
  <text x="112" y="777" class="text">ObservableObject</text>
