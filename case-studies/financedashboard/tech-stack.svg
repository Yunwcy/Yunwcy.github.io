  <text x="847" y="777" class="text">網頁 JSON 轉換</text>
  <text x="847" y="802" class="text">欄位遷移</text>
  <text x="847" y="827" class="text">錯誤提示</text>

  <rect x="1065" y="705" width="220" height="145" rx="16" class="card" stroke="#98efd0"/>
  <text x="1105" y="744" class="card-title">Exporter</text>
  <text x="1092" y="777" class="text">加密備份</text>
  <text x="1092" y="802" class="text">明文 JSON</text>
  <text x="1092" y="827" class="text">投資 CSV</text>

  <rect x="1310" y="705" width="185" height="145" rx="16" class="card" stroke="#98efd0"/>
